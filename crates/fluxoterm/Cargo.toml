[package]
name = "fluxoterm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Terminal viewer/editor for fluxolap servers"

[[bin]]
name = "fluxoterm"
path = "src/main.rs"

[dependencies]
fluxolap-api-types = { path = "../fluxolap-api-types" }
ratatui = "0.30"
tokio = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
axum = { workspace = true }
fluxolap-api = { path = "../fluxolap-api" }
fluxolap-engine = { path = "../fluxolap-engine" }
fluxolap-examples = { path = "../fluxolap-examples" }
