[package]
name = "fluxolap-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "fluxolap"
path = "src/main.rs"

[dependencies]
axum.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
fluxolap-engine = { path = "../fluxolap-engine" }
fluxolap-api = { path = "../fluxolap-api" }
fluxolap-mesh = { path = "../fluxolap-mesh", optional = true }

[features]
# Friends exchange catalogs of their databases over MQTT (docs/mesh.md).
# Off unless built with it, and then only active with FLUXOLAP_MESH_NODE set.
mesh = ["dep:fluxolap-mesh"]
