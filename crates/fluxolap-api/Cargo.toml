[package]
name = "fluxolap-api"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
axum.workspace = true
tower-http.workspace = true
serde_json.workspace = true
utoipa.workspace = true
fluxolap-domain = { path = "../fluxolap-domain" }
fluxolap-storage = { path = "../fluxolap-storage" }
fluxolap-error = { path = "../fluxolap-error" }
fluxolap-engine = { path = "../fluxolap-engine" }
fluxolap-api-types = { path = "../fluxolap-api-types", features = ["convert"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
# The process's resident memory for GET /stats (Linux reads /proc instead).
memory-stats = "1"

[dev-dependencies]
tokio.workspace = true
reqwest.workspace = true
serde_json.workspace = true
