[package]
name = "fluxoscope"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Web app to explore and chart fluxolap cubes (Leptos, WebAssembly)"

[dependencies]
# The server's own API types: a mismatch with fluxolap's REST API is a compile error.
fluxolap-api-types = { path = "../fluxolap-api-types" }
leptos = { version = "0.8", features = ["csr"] }
gloo-net = { version = "0.7", default-features = false, features = ["http", "json"] }
serde.workspace = true
serde_json.workspace = true
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "Location", "History", "Storage", "File", "FileList", "HtmlInputElement"] }
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
